# A release: pushing a tag like v1.2.0 packs the mod into a zip and publishes it, and Obsidian offers it as an
# update to anyone on an older version. The steps are the shared ones for Obsidian mods
# (Alomare/HD1-LuaModdingSkill, .github/workflows/mod-release.yml): the tag has to match "version" in
# obsidian.json, the release notes are the version's section of CHANGELOG.md and follow the rules for
# public text, the tests pass, and export-ignore in .gitattributes sets what goes in the zip. A tag with a
# suffix (v1.2.0-beta.1) makes a prerelease, which Obsidian doesn't offer and Nexus never gets.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    uses: Alomare/HD1-LuaModdingSkill/.github/workflows/mod-release.yml@main

  # A release made with the workflow's own token starts no other workflow, so the upload is called from here.
  nexus:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/nexus.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
